# The product's one Rust workspace (docs/ARCHITECTURE.md, layout). A unit —
# an aggregate, a Capability or a DataCapability — is a member by its folder
# alone, through the three globs: adding one edits no shared file (rule 2,
# gate `workspace-members-by-glob`). Only the plumbing is named.
[workspace]
resolver = "3"
members = [
    "crates/*/aggregates/*",
    "crates/*/capabilities/*",
    "crates/*/data-capabilities/*",
    "crates/ai/provider",
    "crates/data",
    "crates/dataguard/registry",
    "crates/dataguard/server",
    "crates/ports/*",
    "crates/ports/character-sheets/d-d-beyond-public-character-json-service",
    "crates/ports/llm/anthropic-claude-api-default-claude-sonnet-5-5-for-generation-claude-haiku-4-5-20251001-for-summaries-switchable-to-the-dm-s-home-opencode-server-endpoint-or-to-the-opencode-claude-code-binaries",
    "crates/ports/speech-to-text/phonon-local-to-be-evaluated-as-the-decision-requests",
    "crates/server",
    "crates/platform/conformance",
]
# The rules' business tests are a workspace of their own (contract P).
exclude = ["tests/rules/business"]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
harness-dataguard = { git = "https://github.com/laucans/custom-harness", tag = "dataguard-v5", features = ["postgres", "uuid"] }
