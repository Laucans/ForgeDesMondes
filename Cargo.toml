# The product's one Rust workspace (docs/ARCHITECTURE.md, layout). A slice —
# a Capability or a DataCapability — is a member by its folder alone, through
# the two globs: adding one edits no shared file (rule 2, gate
# `workspace-members-by-glob`). Only the plumbing is named.
[workspace]
resolver = "3"
members = [
    "crates/*/capabilities/*",
    "crates/*/data-capabilities/*",
    "crates/data",
    "crates/dataguard/server",
    "crates/media/read",
    "crates/ports/*",
    "crates/ports/llm/anthropic-claude-api-default-claude-sonnet-5-5-for-generation-claude-haiku-4-5-20251001-for-summaries-switchable-to-the-dm-s-home-opencode-server-endpoint-or-to-the-opencode-claude-code-binaries",
    "crates/ports/speech-to-text/phonon-local-to-be-evaluated-as-the-decision-requests",
    "crates/server",
    "crates/platform/conformance",
]
# The rules' business tests are a workspace of their own (contract P).
exclude = ["tests/rules/business"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
