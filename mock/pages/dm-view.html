<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DM view — ForgeDesMondes</title>
  <link rel="stylesheet" href="../design/tokens.css">
  <link rel="stylesheet" href="../kit/kit.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header id="site-header">
    <div data-kit="Menu" data-props='{"brand":"ForgeDesMondes","brandHref":"campagnes.html","navId":"site-nav","label":"Sections","links":[{"label":"Campagnes","href":"campagnes.html","current":true},{"label":"Médias","href":"medias.html"},{"label":"Soundbox","href":"soundbox.html"},{"label":"Paramètres IA","href":"parametres-ia.html"}]}'></div>
    <div data-component="LiveSessionBar"></div>
  </header>
  <div class="dm-layout" id="dm-layout">
    <aside class="dm-layout__left" id="dm-elements" aria-label="Éléments de la séance et de la campagne">
      <div data-component="ElementsPanel"></div>
    </aside>
    <main class="dm-layout__center" id="page-main">
      <div id="dm-center-tabs" data-kit="Tabs" data-props='{"id":"dm-center","label":"Zone principale","tabs":["Fiche","Battlemap","Soundbox"]}'>
        <section id="dm-sheet" aria-label="Fiche ouverte"><div data-component="TableSheet"></div></section>
        <section id="dm-battlemap" aria-label="Battlemap active"><div data-component="Battlemap" data-props='{"instance":"bmi-gue-s4","view":"dm"}'></div></section>
        <section id="dm-soundbox" aria-label="Soundbox"><div data-component="LiveSoundbox"></div></section>
      </div>
    </main>
  </div>
  <div data-component="SuggestionPill"></div>
  <script src="../mock.js"></script>
  <script>
    // The centre follows what the DM opens: an element from the panel or the suggestions, or the battlemap.
    document.addEventListener('fdm:open', () => { const t = document.getElementById('dm-center-tabs'); if (t.tabs) t.tabs.select(0); });
    document.addEventListener('fdm:open-map', () => { const t = document.getElementById('dm-center-tabs'); if (t.tabs) t.tabs.select(1); });
  </script>
</body>
</html>
