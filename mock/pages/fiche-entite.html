<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiche d’entité — ForgeDesMondes</title>
  <link rel="stylesheet" href="../design/tokens.css">
  <link rel="stylesheet" href="../kit/kit.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header id="site-header">
    <div data-kit="Menu" data-props='{"brand":"ForgeDesMondes","brandHref":"campagnes.html","navId":"site-nav","label":"Sections","links":[{"label":"Campagnes","href":"campagnes.html","current":true},{"label":"Médias","href":"medias.html"},{"label":"Soundbox","href":"soundbox.html"},{"label":"Paramètres IA","href":"parametres-ia.html"}]}'></div>
  </header>
  <main id="page-main" class="page-main">
    <section class="page-head" id="page-head">
      <div id="page-breadcrumb" data-kit="Breadcrumb" data-props='{"items":[{"label":"Campagnes","href":"campagnes.html"},{"label":"Campagne","href":"campagne.html"},{"label":"Fiche d’entité"}]}'></div>
      <div data-component="VersionHistory"></div>
    </section>
    <div class="entity-layout" id="entity-layout">
      <aside class="entity-layout__rail" id="entity-rail" aria-label="Éléments de la campagne">
        <div data-component="CampaignElements" data-props='{"mode":"rail"}'></div>
      </aside>
      <div class="entity-layout__main" id="entity-main">
        <div data-component="EntityEditor"></div>
      </div>
    </div>
  </main>
  <footer id="site-footer" class="page-footer">
    <span>ForgeDesMondes · un seul MJ, une seule machine</span>
    <span>Chaque modification par l’IA est réversible depuis l’historique des versions</span>
  </footer>
  <script src="../mock.js"></script>
</body>
</html>
