<div class="mf-versions" id="version-history" data-reads="campaign.listEntityVersions">
  <div class="panel__head" id="versions-head" hidden><h2 id="versions-title"></h2></div>
  <div id="versions-trigger" data-reads="campaign.listEntityVersions" data-kit="Button" data-props='{"small":true,"items":[{"id":"versions-open","label":"Historique des versions","variant":"ghost"}]}'></div>
  <p class="small muted" id="versions-note" hidden></p>
</div>
<style>
  .mf-versions { display: inline-flex; }
  .mf-versions.is-panel { display: grid; gap: var(--space-3); }
  .mf-versions__list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
  .mf-versions__item { display: grid; gap: var(--space-1); padding: var(--space-2) var(--space-3); background: var(--color-surface-2); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-medium); }
  .mf-versions__item.is-unseen { border-color: var(--color-accent); }
  .mf-versions__item .panel__head b { font-family: var(--font-family-heading); color: var(--color-accent); }
  .mf-versions__status { padding: var(--space-2) var(--space-3); border-radius: var(--radius-medium); background: var(--color-surface); border: var(--border-width) solid var(--color-border); }
  .mf-versions__status.is-ok { border-color: var(--color-success); color: var(--color-success); }
  .mf-versions__status.is-error { border-color: var(--color-danger); color: var(--color-danger); }
</style>
<script>
// The Micro-UI's real code (apps/campaign/version-history), bundled by mock/build.sh: it fills this panel on the mock server, in place of the drawing above. Its dialog lists the versions, each with « Voir le diff » and « Revenir à cette version » (data-writes="campaign.restoreEntityVersion"), the diff drawn by the kit's DiffView.
(() => {
  const root = document.currentScript.closest('[data-component]');
  const bundle = document.createElement('script');
  bundle.src = Mock.base + 'components/VersionHistory.js';
  root.appendChild(bundle);
})();
</script>
