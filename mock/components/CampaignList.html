<section class="mf-campaigns" id="campaign-list" aria-labelledby="campaign-list-title">
  <div class="panel__head">
    <h2 id="campaign-list-title">Campagnes et oneshots</h2>
    <div id="campaign-list-actions" data-kit="Button" data-props='{"items":[{"id":"campaign-new","label":"Nouvelle campagne","variant":"primary","data-writes":"campaign.createCampaign"},{"id":"campaign-import","label":"Importer une archive","variant":"secondary","data-writes":"campaign.importCampaign"}]}'></div>
  </div>
  <div class="mf-campaigns__grid" id="campaign-cards" data-reads="campaign.listCampaigns"></div>
</section>
<style>
  .mf-campaigns { display: grid; gap: var(--space-3); }
  .mf-campaigns__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--space-5) * 7), 1fr)); gap: var(--space-4); }
  .mf-campaigns .kit-card { max-width: none; height: 100%; display: flex; flex-direction: column; }
  .mf-campaigns .kit-card .body { flex: 1; }
  .mf-campaigns .kit-card .media { height: calc(var(--space-5) * 4); }
  .mf-campaigns__meta { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; font-size: var(--font-size-small); color: var(--color-text-muted); }
</style>
<script>
(() => {
  const root = document.currentScript.closest('[data-component]');
  const $ = s => root.querySelector(s);
  const esc = Mock.esc;
  const date = d => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  let campaigns = [];

  function card(c) {
    const meta = `<div class="mf-campaigns__meta">${Mock.kitHTML('Badge', { items: [{ label: c.type === 'oneshot' ? 'Oneshot' : 'Campagne', tone: c.type === 'oneshot' ? 'accent' : 'primary' }] })}` +
      `<span>${c.sessions} séance${c.sessions > 1 ? 's' : ''}</span>${c.lastPlayed ? `<span>· jouée le ${date(c.lastPlayed)}</span>` : '<span>· jamais jouée</span>'}</div>` +
      (c.next ? `<p class="small">Prochaine séance : <b>${date(c.next)}</b></p>` : '');
    return `<div id="campaign-${esc(c.id)}">` + Mock.kitHTML('Card', {
      art: { art: c.art, glyph: c.glyph, title: 'Couverture : ' + c.name }, title: c.name, text: c.pitch, html: meta,
      actions: [{ label: 'Ouvrir', href: 'campagne.html' }, { label: 'Exporter', action: 'export', secondary: true, 'data-writes': 'campaign.exportCampaign' }]
    }) + '</div>';
  }
  function render() {
    $('#campaign-cards').innerHTML = campaigns.map(card).join('');
    Mock.mount($('#campaign-cards'));
  }

  root.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.action === 'export') {
      const c = campaigns.find(x => 'campaign-' + x.id === b.closest('[id^="campaign-"]').id);
      const file = c.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-') + '-2026-10-14.fdm.zip';
      Mock.command('campaign.exportCampaign', { id: c.id }, { label: 'Exporter « ' + c.name + ' » → ' + file });
    }
    if (b.id === 'campaign-new') openCreate();
    if (b.id === 'campaign-import') openImport();
  });

  function openCreate() {
    let cover = null;
    const d = Mock.dialog({
      title: 'Nouvelle campagne', id: 'campaign-create-dialog',
      html: Mock.kitHTML('Input', { id: 'campaign-create-name', label: 'Nom', placeholder: 'Les Cendres de Valombre', wide: true }) +
        Mock.kitHTML('Radio', { id: 'campaign-create-type', legend: 'Type', name: 'campaign-type', options: [
          { label: 'Campagne', hint: 'plusieurs séances', value: 'campagne', checked: true },
          { label: 'Oneshot', hint: 'une seule séance', value: 'oneshot' }] }) +
        Mock.kitHTML('FileDrop', { id: 'campaign-create-cover', title: 'Illustration de couverture :', hint: 'Affichée sur la player view quand rien n’est envoyé', types: ['JPG', 'PNG', 'WEBP'], wide: true }),
      actions: [{ label: 'Annuler', variant: 'ghost' }, { label: 'Créer', id: 'campaign-create-submit', 'data-writes': 'campaign.createCampaign', onClick(api) {
        const name = api.el.querySelector('#campaign-create-name').value.trim() || 'Les Brumes de Corbière';
        const type = api.el.querySelector('input[name="campaign-type"]:checked').value;
        api.close();
        Mock.command('campaign.createCampaign', { name, type }, { label: 'Créer « ' + name + ' »' + (cover ? ' avec ' + cover : '') }).then(() => {
          campaigns.unshift({ id: 'nouvelle-' + Date.now(), name, type, art: 'forest', glyph: name.charAt(0).toUpperCase(), pitch: 'Nouvelle ' + (type === 'oneshot' ? 'aventure en une séance.' : 'campagne, aucune séance encore.'), sessions: 0, lastPlayed: null, next: null });
          render();
        });
      } }]
    });
    d.el.addEventListener('kit:file', e => { cover = e.detail.name; });
  }

  function openImport() {
    const d = Mock.dialog({
      title: 'Importer une archive', id: 'campaign-import-dialog',
      text: 'Une archive exportée depuis ForgeDesMondes, sur cette machine ou une autre. Elle contient les éléments, les séances, les médias et les sons de la campagne.',
      html: Mock.kitHTML('FileDrop', { id: 'campaign-import-file', title: 'Déposez l’archive ou', hint: 'Fichier .fdm.zip, jusqu’à 2 Go', types: ['ZIP'], wide: true }) +
        '<button type="button" class="chip" id="campaign-import-sample">Utiliser l’exemple : la-nuit-du-carnaval-pourpre.fdm.zip</button>',
      actions: [{ label: 'Annuler', variant: 'ghost' }, { label: 'Importer', id: 'campaign-import-submit', 'data-writes': 'campaign.importCampaign', onClick(api) {
        api.close();
        Mock.command('campaign.importCampaign', {}, { label: 'Importer l’archive' }).then(() => {
          campaigns.push({ id: 'import-' + Date.now(), name: 'Les Brumes de Corbière', type: 'oneshot', art: 'forest', glyph: 'B', pitch: 'Importée depuis une archive le 14 octobre 2026.', sessions: 1, lastPlayed: '2026-06-06', next: null });
          render();
        });
      } }]
    });
    d.el.querySelector('#campaign-import-sample').addEventListener('click', () => {
      d.el.querySelector('#campaign-import-file').closest('[data-kit]').filedrop.simulate({ name: 'la-nuit-du-carnaval-pourpre.fdm.zip', size: 12582912 });
    });
  }

  Mock.fixture('fixtures/CampaignList.json').then(data => { campaigns = data.campaigns; render(); });
})();
</script>
