<div class="mf-sounds layout-2" id="sound-library">
  <section class="panel" id="sounds-list-panel" aria-labelledby="sounds-title">
    <div class="panel__head">
      <h2 id="sounds-title">Sons de la campagne</h2>
      <span class="small muted" id="sounds-count" data-reads="soundbox.listSounds"></span>
    </div>
    <div id="sounds-search" data-kit="Input" data-props='{"id":"sounds-search-input","label":"Rechercher","type":"search","placeholder":"Nom ou tag : porte, combat, extérieur…"}'></div>
    <div class="row" id="sounds-filter" aria-live="polite"></div>
    <div id="sounds-table" data-reads="soundbox.listSounds" aria-live="polite"></div>
    <div id="sounds-status" aria-live="polite"></div>
  </section>
  <aside class="stack" id="sounds-side">
    <form class="panel" id="sounds-upload" aria-labelledby="sounds-upload-title" onsubmit="return false">
      <h2 id="sounds-upload-title">Téléverser un son</h2>
      <p class="small muted">Effets ponctuels uniquement. Le nom sert aussi à la détection au micro : dites « la porte grince » et le son vous est proposé.</p>
      <div id="sounds-upload-fields">
        <div data-kit="FileDrop" data-props='{"id":"sounds-drop","title":"Déposez un son ou","hint":"Effet ponctuel, 30 s maximum","types":["OGG","MP3","WAV"],"wide":true}'></div>
        <div data-kit="Input" data-props='{"id":"sounds-new-name","label":"Nom","placeholder":"Porte qui grince","wide":true}'></div>
        <div data-kit="Input" data-props='{"id":"sounds-new-tags","label":"Tags","placeholder":"porte, bois, intérieur","wide":true,"hint":"Séparés par des virgules"}'></div>
        <div data-kit="Button" data-props='{"items":[{"id":"sounds-new-submit","label":"Ajouter à la soundbox","variant":"primary","data-writes":"soundbox.addSound"}]}'></div>
      </div>
      <div id="sounds-upload-result" aria-live="polite"></div>
    </form>
    <form class="panel" id="sounds-edit" aria-labelledby="sounds-edit-title" onsubmit="return false" hidden>
      <h2 id="sounds-edit-title">Modifier le son</h2>
      <div id="sounds-edit-fields">
        <div data-kit="Input" data-props='{"id":"sounds-edit-name","label":"Nom","wide":true}'></div>
        <div data-kit="Input" data-props='{"id":"sounds-edit-tags","label":"Tags","wide":true,"hint":"Séparés par des virgules"}'></div>
        <div data-kit="Slider" data-props='{"bare":true,"fields":[{"id":"sounds-edit-volume","name":"volume","label":"Volume propre","value":75,"min":0,"max":100,"unit":"%"}]}'></div>
        <div data-kit="Button" data-props='{"items":[{"id":"sounds-edit-save","label":"Enregistrer","variant":"primary","data-writes":"soundbox.updateSound"},{"id":"sounds-edit-delete","label":"Supprimer","variant":"danger","data-writes":"soundbox.removeSound"},{"id":"sounds-edit-cancel","label":"Fermer","variant":"ghost"}]}'></div>
      </div>
      <div id="sounds-edit-result" aria-live="polite"></div>
    </form>
  </aside>
</div>
<style>
  .mf-sounds .kit-input { max-width: none; }
  .mf-sounds__tags { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .mf-sounds__tags button { padding: 0 var(--space-2); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-pill); background: transparent; font: inherit; font-size: var(--font-size-small); color: var(--color-text-muted); cursor: pointer; }
  .mf-sounds__tags button:hover, .mf-sounds__tags button:focus-visible { border-color: var(--color-primary); color: var(--color-accent); }
  .mf-sounds__tags button[aria-pressed="true"] { border-color: var(--color-primary); color: var(--color-primary); }
  .mf-sounds tr.is-playing td:first-child::before { content: "▶ "; color: var(--color-success); }
  .mf-sounds .is-ok, .mf-sounds .is-error { padding: var(--space-2) var(--space-3); border-radius: var(--radius-medium); background: var(--color-surface); border: var(--border-width) solid var(--color-border); }
  .mf-sounds .is-ok { border-color: var(--color-success); color: var(--color-success); }
  .mf-sounds .is-error { border-color: var(--color-danger); color: var(--color-danger); }
</style>
<script>
// The Micro-UI's real code (apps/soundbox/sound-library), bundled by mock/build.sh: it fills this card on the mock server, in place of the drawing above.
(() => {
  const root = document.currentScript.closest('[data-component]');
  const bundle = document.createElement('script');
  bundle.src = Mock.base + 'components/SoundLibrary.js';
  root.appendChild(bundle);
})();
</script>
