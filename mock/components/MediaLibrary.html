<section class="panel mf-media" id="media-library" aria-labelledby="media-title">
  <div class="panel__head">
    <h2 id="media-title">Bibliothèque de médias</h2>
    <span class="small muted" id="media-count" data-reads="media.listMedia session.listScenes campaign.listPlaces"></span>
  </div>
  <form class="mf-media__upload" id="media-upload" onsubmit="return false">
    <div id="media-upload-drop"></div>
    <div class="stack" id="media-upload-fields" data-reads="campaign.listPlaces">
      <button type="button" class="primary" id="media-upload-submit" data-writes="media.uploadMedia">Ajouter à la campagne</button>
    </div>
  </form>
  <div class="mf-media__message" id="media-message" aria-live="polite"></div>
  <section id="media-battlemaps" aria-labelledby="media-battlemaps-title" class="stack">
    <h3 id="media-battlemaps-title">Battlemaps</h3>
    <ul class="mf-media__grid" id="media-battlemaps-list" data-reads="media.listMedia session.listScenes campaign.listPlaces"></ul>
  </section>
  <section id="media-illustrations" aria-labelledby="media-illustrations-title" class="stack">
    <h3 id="media-illustrations-title">Illustrations</h3>
    <ul class="mf-media__grid" id="media-illustrations-list" data-reads="media.listMedia session.listScenes campaign.listPlaces">
      <li class="mf-media__item" id="media-sample" data-id="sample">
        <b>Carte d’un lieu</b>
        <select id="media-place-sample" data-writes="media.setMediaPlace"></select>
        <small id="media-session-sample"><span class="chip chip--lieu">Associé à la séance 4</span></small>
        <button type="button" class="ghost" data-action="add-place:sample" data-writes="session.addPlaceToSession">Ajouter le lieu à la séance</button>
      </li>
    </ul>
  </section>
</section>
<style>
  .mf-media__upload { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--space-3); align-items: start; }
  .mf-media__grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--space-5) * 4.5), 1fr)); gap: var(--space-3); }
  .mf-media__item { display: grid; gap: var(--space-1); padding: var(--space-2); background: var(--color-surface); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-medium); }
  .mf-media__item.is-selected { border-color: var(--color-primary); box-shadow: var(--shadow-high); }
  .mf-media__thumb { height: calc(var(--space-5) * 2.5); border-radius: var(--radius-small); overflow: hidden; }
  .mf-media__item b { font-size: var(--font-size-small); }
  .mf-media__item small { color: var(--color-text-muted); }
  @media (max-width: 900px) { .mf-media__upload { grid-template-columns: minmax(0, 1fr); } }
</style>
<script>
// The Micro-UI's real code (apps/media/media-library), bundled by mock/build.sh: it fills this card on the mock server, in place of the drawing above.
(() => {
  const root = document.currentScript.closest('[data-component]');
  const bundle = document.createElement('script');
  bundle.src = Mock.base + 'components/MediaLibrary.js';
  root.appendChild(bundle);
})();
</script>
