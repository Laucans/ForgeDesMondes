<section class="panel mf-brief" id="oral-brief" aria-labelledby="brief-title">
  <div class="panel__head">
    <h2 id="brief-title">Brief oral</h2>
    <span class="small muted" id="brief-last" data-reads="session.getLastBrief"></span>
  </div>
  <p class="small muted">Racontez la séance au micro, ou tapez-la. L’IA en tire les scènes, reconnaît les PNJ, lieux et événements existants et place les manquants dans la liste « à créer ».</p>
  <div id="brief-input">
    <div class="kit-textarea is-wide">
      <label class="kit-textarea__label" for="brief-text">Brief de la séance</label>
      <textarea class="kit-textarea__field" id="brief-text" rows="5"></textarea>
      <div class="kit-textarea__footer"><p class="kit-textarea__hint">Seul le texte part vers l’IA, jamais le son.</p></div>
    </div>
  </div>
  <div class="row" id="brief-controls">
    <div data-kit="MicButton" data-props='{"id":"brief-mic","label":"Brief oral","texts":{"idle":"Prêt à écouter","recording":"J’écoute le brief","paused":"En pause — reprenez ou analysez"}}'></div>
    <div data-kit="Button" data-props='{"items":[{"id":"brief-analyse","label":"Terminer et analyser","variant":"primary","disabled":true,"data-writes":"ai.analyzeBrief"}]}'></div>
  </div>
  <div class="mf-brief__result" id="brief-result" data-reads="session.getLastBrief"></div>
</section>
<style>
  .mf-brief__lines { margin: 0; padding-left: var(--space-4); display: grid; gap: var(--space-1); max-height: calc(var(--space-5) * 5); overflow-y: auto; }
  .mf-brief__result { display: grid; gap: var(--space-3); }
  .mf-brief__cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(var(--space-5) * 6), 1fr)); gap: var(--space-3); }
  .mf-brief__col { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-3); background: var(--color-surface); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-medium); }
  .mf-brief__col h3 { font-size: var(--font-size-small); color: var(--color-accent); }
  .mf-brief__col ol, .mf-brief__col ul { margin: 0; padding-left: var(--space-4); display: grid; gap: var(--space-1); }
  .mf-brief__col small { color: var(--color-text-muted); }
  .mf-brief__upd { display: inline-flex; gap: var(--space-2); align-items: center; }
</style>
<script>
// The Micro-UI's real code (apps/ai/oral-brief), bundled by mock/build.sh: it fills this screen on the mock server, in place of the drawing above.
(() => {
  const root = document.currentScript.closest('[data-component]');
  const bundle = document.createElement('script');
  bundle.src = Mock.base + 'components/OralBrief.js';
  root.appendChild(bundle);
})();
</script>
