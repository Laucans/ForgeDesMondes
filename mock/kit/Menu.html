<!-- Menu: a horizontal navigation bar, the brand at the left, the current link marked. -->
<style>
.kit-menu { display: flex; align-items: center; gap: var(--space-4, 24px); padding: var(--space-3, 16px) var(--space-4, 24px); background: var(--color-surface, #120a1c); border-bottom: calc(var(--border-width, 1px) * 2) solid var(--color-secondary, #8b3fd9); font-family: var(--font-family, system-ui, sans-serif); box-shadow: var(--shadow-high, 0 12px 32px rgba(139, 63, 217, 0.35), 0 4px 12px rgba(0, 0, 0, 0.6)); }
.kit-menu .brand { font-family: var(--font-family-heading, Impact, Arial, sans-serif); font-weight: var(--font-weight-heading, 700); font-size: var(--font-size-heading, 2rem); color: var(--color-primary, #e8702a); text-decoration: none; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1; }
.kit-menu nav { display: flex; gap: var(--space-2, 8px); margin-left: var(--space-2, 8px); }
.kit-menu nav a { color: var(--color-text-muted, #b9a6c9); text-decoration: none; padding: var(--space-2, 8px) var(--space-3, 16px); border-radius: var(--radius-pill, 999px); font-size: var(--font-size-base, 1rem); border: var(--border-width, 1px) solid transparent; transition: color 0.15s, background 0.15s, border-color 0.15s; }
.kit-menu nav a:hover { color: var(--color-text, #f5ecf7); background: var(--color-surface-2, #1f1331); border-color: var(--color-border, #3d2b57); }
.kit-menu nav a:focus-visible { outline: 2px solid var(--color-accent, #f5b83d); outline-offset: 2px; }
.kit-menu nav a[aria-current="page"] { color: var(--color-primary-contrast, #14081f); background: var(--color-primary, #e8702a); border-color: var(--color-primary, #e8702a); font-weight: var(--font-weight-heading, 700); box-shadow: var(--shadow-low, 0 2px 6px rgba(0, 0, 0, 0.5)); }
.kit-menu .end { margin-left: auto; display: flex; gap: var(--space-2, 8px); }
.kit-menu .end button { font: inherit; font-size: var(--font-size-base, 1rem); font-weight: var(--font-weight-heading, 700); padding: var(--space-2, 8px) var(--space-4, 24px); border-radius: var(--radius-pill, 999px); border: var(--border-width, 1px) solid var(--color-accent, #f5b83d); background: var(--color-accent, #f5b83d); color: var(--color-primary-contrast, #14081f); cursor: pointer; box-shadow: var(--shadow-low, 0 2px 6px rgba(0, 0, 0, 0.5)); }
.kit-menu .end button:hover { background: var(--color-primary, #e8702a); border-color: var(--color-primary, #e8702a); }
.kit-menu .end button:focus-visible { outline: 2px solid var(--color-text, #f5ecf7); outline-offset: 2px; }
</style>
<header class="kit-menu">
  <a class="brand" href="#">Voltage</a>
  <nav><a href="#" aria-current="page">Home</a><a href="#">Catalogue</a><a href="#">Orders</a><a href="#">Help</a></nav>
  <div class="end"><button type="button">Sign in</button></div>
</header>
