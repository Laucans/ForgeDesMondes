<!-- Select: a labelled drop list, opened by a click, one option picked. -->
<style>
.kit-select { position: relative; max-width: 300px; font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #f4eeff); }
.kit-select > span { display: block; font-family: var(--font-family-heading, Georgia, serif); font-weight: var(--font-weight-heading, 700); font-size: var(--font-size-small, 0.875rem); color: var(--color-accent, #ffc233); text-transform: uppercase; letter-spacing: .1em; margin-bottom: var(--space-2, 8px); }
.kit-select button { width: 100%; display: flex; justify-content: space-between; align-items: center; font: inherit; font-size: var(--font-size-base, 1rem); color: inherit; padding: var(--space-2, 8px) var(--space-3, 16px); border: var(--border-width, 1px) solid var(--color-border, #33274f); border-radius: var(--radius-pill, 999px); background: var(--color-surface-2, #171025); box-shadow: var(--shadow-low, 0 2px 8px rgba(0, 0, 0, 0.6)); cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease; }
.kit-select button:hover { border-color: var(--color-primary, #a855f7); }
.kit-select button b { font-weight: inherit; }
.kit-select button i { font-style: normal; color: var(--color-primary, #a855f7); margin-left: var(--space-2, 8px); }
.kit-select button:focus { outline: 2px solid var(--color-accent-cyan, #27d7f0); outline-offset: 2px; }
.kit-select button[aria-expanded="true"] { border-color: var(--color-primary, #a855f7); }
.kit-select ul { position: absolute; left: 0; right: 0; margin: var(--space-2, 8px) 0 0; padding: var(--space-2, 8px); list-style: none; background: var(--color-surface-2, #171025); border: var(--border-width, 1px) solid var(--color-border, #33274f); border-radius: var(--radius-large, 16px); box-shadow: var(--shadow-high, 0 12px 32px rgba(0, 0, 0, 0.75)); z-index: 5; }
.kit-select ul[hidden] { display: none; }
.kit-select li { padding: var(--space-2, 8px) var(--space-3, 16px); border-radius: var(--radius-pill, 999px); color: var(--color-text-muted, #b5a8cf); cursor: pointer; }
.kit-select li:hover { background: var(--color-surface, #0b0713); color: var(--color-text, #f4eeff); }
.kit-select li[aria-selected="true"] { background: var(--color-primary, #a855f7); color: var(--color-primary-contrast, #0b0713); font-weight: var(--font-weight-heading, 700); }
</style>
<div class="kit-select">
  <span>Currency</span>
  <button type="button" aria-haspopup="listbox" aria-expanded="false"><b data-value>Euro (EUR)</b><i aria-hidden="true">▾</i></button>
  <ul role="listbox" hidden>
    <li role="option" aria-selected="true">Euro (EUR)</li>
    <li role="option">US dollar (USD)</li>
    <li role="option">Canadian dollar (CAD)</li>
    <li role="option">Pound sterling (GBP)</li>
  </ul>
</div>
<script>
(() => {
  const root = document.currentScript.closest('[data-kit]') || document.currentScript.parentElement;
  const button = root.querySelector('button');
  const list = root.querySelector('ul');
  button.addEventListener('click', () => { list.hidden = !list.hidden; button.setAttribute('aria-expanded', String(!list.hidden)); });
  list.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li) return;
    list.querySelectorAll('li').forEach((x) => x.setAttribute('aria-selected', String(x === li)));
    root.querySelector('[data-value]').textContent = li.textContent;
    list.hidden = true;
    button.setAttribute('aria-expanded', 'false');
  });
})();
</script>
