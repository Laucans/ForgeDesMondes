<!-- Radio group: options to pick one from. -->
<style>
.kit-radio { font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #f4eeff); font-size: var(--font-size-base, 1rem); }
.kit-radio fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: var(--space-2, 0.5rem); }
.kit-radio legend { font-family: var(--font-family-heading, Georgia, serif); font-weight: var(--font-weight-heading, 700); font-size: var(--font-size-small, 0.875rem); color: var(--color-accent, #ffc233); text-transform: uppercase; letter-spacing: .12em; padding: 0; margin-bottom: var(--space-2, 0.5rem); }
.kit-radio label { display: flex; align-items: center; gap: var(--space-3, 1rem); padding: var(--space-2, 0.5rem) var(--space-3, 1rem); background: var(--color-surface, #0b0713); border: var(--border-width, 1px) solid var(--color-border, #33274f); border-radius: var(--radius-large, 16px); cursor: pointer; transition: border-color .15s, box-shadow .15s, background .15s; }
.kit-radio label:hover { border-color: var(--color-primary, #a855f7); }
.kit-radio label:has(input:checked) { border-color: var(--color-primary, #a855f7); background: var(--color-surface-2, #171025); box-shadow: var(--shadow-low, 0 2px 8px rgba(0, 0, 0, 0.6)); }
.kit-radio label:has(input:focus-visible) { outline: 2px solid var(--color-accent-cyan, #27d7f0); outline-offset: 2px; }
.kit-radio input { margin: 0; accent-color: var(--color-primary, #a855f7); width: var(--font-size-large, 1.25rem); height: var(--font-size-large, 1.25rem); }
.kit-radio span { color: var(--color-text, #f4eeff); }
.kit-radio small { color: var(--color-text-muted, #b5a8cf); margin-left: auto; font-size: var(--font-size-small, 0.875rem); }
.kit-radio label:has(input:checked) small { color: var(--color-accent-cyan, #27d7f0); }
</style>
<div class="kit-radio">
  <fieldset>
    <legend>Shipping</legend>
    <label><input type="radio" name="kit-ship" checked><span>Standard</span><small>3–5 days</small></label>
    <label><input type="radio" name="kit-ship"><span>Express</span><small>tomorrow</small></label>
    <label><input type="radio" name="kit-ship"><span>Pick up</span><small>free</small></label>
  </fieldset>
</div>
