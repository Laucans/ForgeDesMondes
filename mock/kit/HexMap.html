<div class="kit-hexmap">
  <div class="hm-bar">
    <label class="hm-field">Taille <input type="range" data-ctl="size" min="20" max="44" value="32"></label>
    <label class="hm-field">Décalage X <input type="range" data-ctl="ox" min="0" max="60" value="20"></label>
    <label class="hm-field">Décalage Y <input type="range" data-ctl="oy" min="0" max="60" value="20"></label>
    <label class="hm-field">Orientation
      <select data-ctl="orient">
        <option value="pointy">Pointe en haut</option>
        <option value="flat">Côté plat en haut</option>
      </select>
    </label>
    <label class="hm-field">Couleur
      <select data-ctl="color">
        <option value="text">Ivoire</option>
        <option value="accent">Ambre</option>
        <option value="primary">Orange</option>
      </select>
    </label>
    <label class="hm-field">Opacité <input type="range" data-ctl="opacity" min="5" max="100" value="45"></label>
    <span class="hm-zoom">
      <button type="button" data-act="out" aria-label="Dézoomer">−</button>
      <button type="button" data-act="reset">1:1</button>
      <button type="button" data-act="in" aria-label="Zoomer">+</button>
    </span>
  </div>
  <div class="hm-view" tabindex="0" aria-label="Carte hexagonale : glisser pour déplacer, molette pour zoomer, cliquer deux hex pour tracer un trajet">
    <div class="hm-stage">
      <svg class="hm-layer hm-map" viewBox="0 0 800 560" width="800" height="560" aria-hidden="true">
        <rect class="hm-land" x="0" y="0" width="800" height="560"></rect>
        <ellipse class="hm-water" cx="640" cy="130" rx="150" ry="90"></ellipse>
        <ellipse class="hm-water" cx="700" cy="200" rx="90" ry="60"></ellipse>
        <path class="hm-river" d="M640 210 C 560 280, 600 340, 480 400 S 380 500, 400 560"></path>
        <ellipse class="hm-forest" cx="180" cy="400" rx="140" ry="80"></ellipse>
        <ellipse class="hm-forest" cx="300" cy="460" rx="90" ry="50"></ellipse>
        <ellipse class="hm-hill" cx="330" cy="150" rx="110" ry="60"></ellipse>
        <path class="hm-road" d="M30 80 C 200 120, 300 260, 520 300 S 740 420, 780 520"></path>
      </svg>
      <svg class="hm-layer hm-grid" viewBox="0 0 800 560" width="800" height="560" aria-hidden="true"><path class="hm-grid-path" d=""></path></svg>
      <svg class="hm-layer hm-over" viewBox="0 0 800 560" width="800" height="560"></svg>
    </div>
    <div class="hm-tip" hidden></div>
  </div>
  <p class="hm-hint">Cliquer un hex de départ puis un hex d’arrivée · 1 hex = 5 pi</p>

  <style>
    .kit-hexmap { font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #f5ecf7); background: var(--color-surface, #120a1c); border: var(--border-width, 1px) solid var(--color-border, #3d2b57); border-radius: var(--radius-medium, 12px); padding: var(--space-3, 16px); box-shadow: var(--shadow-low, 0 2px 6px rgba(0,0,0,.5)); --hm-grid: var(--color-text, #f5ecf7); max-width: 100%; box-sizing: border-box; }
    .kit-hexmap *, .kit-hexmap *::before, .kit-hexmap *::after { box-sizing: border-box; }
    .kit-hexmap .hm-bar { display: flex; flex-wrap: wrap; gap: var(--space-2, 8px) var(--space-3, 16px); align-items: flex-end; margin-bottom: var(--space-3, 16px); }
    .kit-hexmap .hm-field { display: flex; flex-direction: column; gap: var(--space-1, 4px); font-size: var(--font-size-small, 0.875rem); color: var(--color-text-muted, #b9a6c9); }
    .kit-hexmap .hm-field input[type="range"] { width: 110px; accent-color: var(--color-primary, #e8702a); }
    .kit-hexmap .hm-field select { background: var(--color-surface-2, #1f1331); color: var(--color-text, #f5ecf7); border: var(--border-width, 1px) solid var(--color-border, #3d2b57); border-radius: var(--radius-small, 6px); padding: var(--space-1, 4px) var(--space-2, 8px); font: inherit; }
    .kit-hexmap .hm-zoom { display: inline-flex; gap: var(--space-1, 4px); margin-left: auto; }
    .kit-hexmap .hm-zoom button { min-width: 36px; height: 32px; background: var(--color-surface-2, #1f1331); color: var(--color-text, #f5ecf7); border: var(--border-width, 1px) solid var(--color-border, #3d2b57); border-radius: var(--radius-small, 6px); font: inherit; cursor: pointer; }
    .kit-hexmap .hm-zoom button:hover { background: var(--color-primary, #e8702a); color: var(--color-primary-contrast, #14081f); }
    .kit-hexmap .hm-view { position: relative; height: 420px; overflow: hidden; cursor: grab; touch-action: none; user-select: none; border-radius: var(--radius-small, 6px); border: var(--border-width, 1px) solid var(--color-border, #3d2b57); background: var(--color-surface-2, #1f1331); outline: none; }
    .kit-hexmap .hm-view:focus-visible { border-color: var(--color-primary, #e8702a); }
    .kit-hexmap .hm-view.hm-drag { cursor: grabbing; }
    .kit-hexmap .hm-stage { position: absolute; left: 0; top: 0; width: 800px; height: 560px; transform-origin: 0 0; }
    .kit-hexmap .hm-layer { position: absolute; left: 0; top: 0; display: block; }
    .kit-hexmap .hm-land { fill: var(--color-surface-2, #1f1331); }
    .kit-hexmap .hm-water { fill: var(--color-secondary, #8b3fd9); opacity: 0.45; }
    .kit-hexmap .hm-forest { fill: var(--color-success, #3ecf8e); opacity: 0.22; }
    .kit-hexmap .hm-hill { fill: var(--color-accent, #f5b83d); opacity: 0.18; }
    .kit-hexmap .hm-river { fill: none; stroke: var(--color-secondary, #8b3fd9); stroke-width: 6; opacity: 0.6; stroke-linecap: round; }
    .kit-hexmap .hm-road { fill: none; stroke: var(--color-accent, #f5b83d); stroke-width: 3; stroke-dasharray: 10 8; opacity: 0.55; }
    .kit-hexmap .hm-grid-path { fill: none; stroke: var(--hm-grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .kit-hexmap .hm-hover { fill: var(--color-text, #f5ecf7); fill-opacity: 0.12; stroke: var(--color-text, #f5ecf7); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .kit-hexmap .hm-step { fill: var(--color-success, #3ecf8e); fill-opacity: 0.3; stroke: var(--color-success, #3ecf8e); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .kit-hexmap .hm-end { fill: var(--color-success, #3ecf8e); fill-opacity: 0.55; stroke: var(--color-success, #3ecf8e); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    .kit-hexmap .hm-line { fill: none; stroke: var(--color-success, #3ecf8e); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .kit-hexmap .hm-token { fill: var(--color-primary, #e8702a); stroke: var(--color-primary-contrast, #14081f); stroke-width: 2; }
    .kit-hexmap .hm-token.hm-foe { fill: var(--color-danger, #ff5a5f); }
    .kit-hexmap .hm-token.hm-ally { fill: var(--color-secondary, #8b3fd9); }
    .kit-hexmap .hm-glyph { fill: var(--color-primary-contrast, #14081f); font-family: var(--font-family-heading, Impact, sans-serif); font-weight: var(--font-weight-heading, 700); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .kit-hexmap .hm-name { fill: var(--color-text, #f5ecf7); font-family: var(--font-family, sans-serif); font-size: 11px; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--color-surface, #120a1c); stroke-width: 3; }
    .kit-hexmap .hm-tip { position: absolute; z-index: 2; pointer-events: none; white-space: nowrap; background: var(--color-success, #3ecf8e); color: var(--color-primary-contrast, #14081f); font-size: var(--font-size-small, 0.875rem); font-weight: 700; padding: var(--space-1, 4px) var(--space-2, 8px); border-radius: var(--radius-pill, 999px); box-shadow: var(--shadow-low, 0 2px 6px rgba(0,0,0,.5)); }
    .kit-hexmap .hm-tip[hidden] { display: none; }
    .kit-hexmap .hm-hint { margin: var(--space-2, 8px) 0 0; font-size: var(--font-size-small, 0.875rem); color: var(--color-text-muted, #b9a6c9); }
  </style>

  <script>
  (function () {
    var host = document.currentScript.closest('[data-kit]') || document.currentScript.parentElement;
    var root = host.querySelector('.kit-hexmap');
    if (!root) return;
    var NS = 'http://www.w3.org/2000/svg';
    var W = 800, H = 560, S3 = Math.sqrt(3), FT = 5;
    var view = root.querySelector('.hm-view');
    var stage = root.querySelector('.hm-stage');
    var gridPath = root.querySelector('.hm-grid-path');
    var over = root.querySelector('.hm-over');
    var tip = root.querySelector('.hm-tip');
    function ctl(n) { return root.querySelector('[data-ctl="' + n + '"]'); }

    var st = { size: 32, ox: 20, oy: 20, orient: 'pointy', px: 0, py: 0, z: 1, start: { q: 1, r: 1 }, end: { q: 4, r: 3 }, hover: null };
    var tokens = [
      { q: 1, r: 1, g: 'É', n: 'Éclaireur', k: '' },
      { q: 4, r: 3, g: 'C', n: 'Chariot', k: 'ally' },
      { q: 6, r: 1, g: 'T', n: 'Tour de guet', k: 'ally' },
      { q: 3, r: 5, g: 'L', n: 'Loup gris', k: 'foe' },
      { q: 6, r: 4, g: 'M', n: 'Marchand', k: '' }
    ];
    var colors = { text: 'var(--color-text, #f5ecf7)', accent: 'var(--color-accent, #f5b83d)', primary: 'var(--color-primary, #e8702a)' };

    function center(q, r) {
      var s = st.size, x, y;
      if (st.orient === 'pointy') { x = s * S3 * (q + r / 2); y = s * 1.5 * r; }
      else { x = s * 1.5 * q; y = s * S3 * (r + q / 2); }
      return { x: x + st.ox + s, y: y + st.oy + s };
    }
    function toHex(x, y) {
      var s = st.size, q, r;
      x -= st.ox + s; y -= st.oy + s;
      if (st.orient === 'pointy') { q = (S3 / 3 * x - y / 3) / s; r = (2 / 3 * y) / s; }
      else { q = (2 / 3 * x) / s; r = (-x / 3 + S3 / 3 * y) / s; }
      return round(q, r);
    }
    function round(q, r) {
      var x = q, z = r, y = -x - z;
      var rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
      var dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
      if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
      return { q: rx, r: rz };
    }
    function dist(a, b) {
      var dq = a.q - b.q, dr = a.r - b.r;
      return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
    }
    function line(a, b) {
      var n = dist(a, b), out = [];
      for (var i = 0; i <= n; i++) {
        var t = n === 0 ? 0 : i / n;
        out.push(round(a.q + (b.q - a.q) * t + 1e-6, a.r + (b.r - a.r) * t + 2e-6));
      }
      return out;
    }
    function corners(c) {
      var pts = [], off = st.orient === 'pointy' ? -30 : 0;
      for (var i = 0; i < 6; i++) {
        var a = (60 * i + off) * Math.PI / 180;
        pts.push([c.x + st.size * Math.cos(a), c.y + st.size * Math.sin(a)]);
      }
      return pts;
    }
    function el(name, attrs, cls) {
      var e = document.createElementNS(NS, name);
      if (cls) e.setAttribute('class', cls);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }
    function poly(h, cls) {
      var pts = corners(center(h.q, h.r)).map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
      return el('polygon', { points: pts }, cls);
    }

    function drawGrid() {
      var d = '';
      for (var q = -30; q <= 40; q++) {
        for (var r = -30; r <= 40; r++) {
          var c = center(q, r);
          if (c.x < -st.size || c.x > W + st.size || c.y < -st.size || c.y > H + st.size) continue;
          var p = corners(c);
          d += 'M' + p.map(function (v) { return v[0].toFixed(1) + ' ' + v[1].toFixed(1); }).join('L') + 'Z';
        }
      }
      gridPath.setAttribute('d', d);
    }
    function drawOver() {
      while (over.firstChild) over.removeChild(over.firstChild);
      if (st.hover) over.appendChild(poly(st.hover, 'hm-hover'));
      var target = st.end || st.hover;
      if (st.start && target) {
        var cells = line(st.start, target);
        cells.forEach(function (h, i) { over.appendChild(poly(h, i === cells.length - 1 ? 'hm-end' : 'hm-step')); });
        var pts = cells.map(function (h) { var c = center(h.q, h.r); return c.x.toFixed(1) + ',' + c.y.toFixed(1); }).join(' ');
        over.appendChild(el('polyline', { points: pts }, 'hm-line'));
      } else if (st.start) {
        over.appendChild(poly(st.start, 'hm-end'));
      }
      tokens.forEach(function (t) {
        var c = center(t.q, t.r), rad = st.size * 0.55;
        over.appendChild(el('circle', { cx: c.x, cy: c.y, r: rad }, 'hm-token' + (t.k ? ' hm-' + t.k : '')));
        var g = el('text', { x: c.x, y: c.y, 'font-size': Math.round(rad * 1.1) }, 'hm-glyph');
        g.textContent = t.g; over.appendChild(g);
        var n = el('text', { x: c.x, y: c.y + rad + 12 }, 'hm-name');
        n.textContent = t.n; over.appendChild(n);
      });
    }
    function applyView() {
      stage.style.transform = 'translate(' + st.px + 'px,' + st.py + 'px) scale(' + st.z + ')';
    }
    function redraw() { drawGrid(); drawOver(); }

    function zoomAt(f, cx, cy) {
      var nz = Math.max(0.5, Math.min(3, st.z * f));
      var k = nz / st.z;
      st.px = cx - (cx - st.px) * k; st.py = cy - (cy - st.py) * k; st.z = nz;
      applyView();
    }
    function world(e) {
      var b = view.getBoundingClientRect();
      var lx = e.clientX - b.left, ly = e.clientY - b.top;
      return { lx: lx, ly: ly, x: (lx - st.px) / st.z, y: (ly - st.py) / st.z };
    }
    function updateTip(w) {
      var a = st.start, b = st.end || st.hover;
      if (!a || !b || !w) { tip.hidden = true; return; }
      var n = dist(a, b);
      tip.textContent = n + ' hex · ' + (n * FT) + ' pi';
      tip.style.left = (w.lx + 16) + 'px';
      tip.style.top = (w.ly + 16) + 'px';
      tip.hidden = false;
    }

    var down = null;
    view.addEventListener('pointerdown', function (e) {
      down = { x: e.clientX, y: e.clientY, px: st.px, py: st.py, moved: false };
      view.setPointerCapture(e.pointerId);
    });
    view.addEventListener('pointermove', function (e) {
      if (down) {
        var dx = e.clientX - down.x, dy = e.clientY - down.y;
        if (!down.moved && Math.abs(dx) + Math.abs(dy) > 4) { down.moved = true; view.classList.add('hm-drag'); }
        if (down.moved) { st.px = down.px + dx; st.py = down.py + dy; applyView(); }
      }
      var w = world(e);
      st.hover = toHex(w.x, w.y);
      drawOver();
      updateTip(w);
    });
    view.addEventListener('pointerup', function (e) {
      var wasClick = down && !down.moved;
      down = null; view.classList.remove('hm-drag');
      if (!wasClick) return;
      var w = world(e), h = toHex(w.x, w.y);
      if (!st.start || st.end) { st.start = h; st.end = null; }
      else { st.end = h; }
      st.hover = h; drawOver(); updateTip(w);
    });
    view.addEventListener('pointerleave', function () {
      if (down) return;
      st.hover = null; drawOver(); tip.hidden = true;
    });
    view.addEventListener('wheel', function (e) {
      e.preventDefault();
      var b = view.getBoundingClientRect();
      zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - b.left, e.clientY - b.top);
    }, { passive: false });

    root.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var a = btn.getAttribute('data-act'), cx = view.clientWidth / 2, cy = view.clientHeight / 2;
        if (a === 'in') zoomAt(1.25, cx, cy);
        else if (a === 'out') zoomAt(1 / 1.25, cx, cy);
        else { st.px = 0; st.py = 0; st.z = 1; applyView(); }
      });
    });
    ['size', 'ox', 'oy'].forEach(function (n) {
      ctl(n).addEventListener('input', function () { st[n] = +ctl(n).value; redraw(); });
    });
    ctl('orient').addEventListener('change', function () { st.orient = ctl('orient').value; redraw(); });
    ctl('color').addEventListener('change', function () { root.style.setProperty('--hm-grid', colors[ctl('color').value]); });
    ctl('opacity').addEventListener('input', function () { gridPath.style.opacity = ctl('opacity').value / 100; });

    gridPath.style.opacity = 0.45;
    applyView();
    redraw();
  })();
  </script>
</div>
