<!-- Breadcrumb: the path to the current page, each step a link. -->
<style>
.kit-breadcrumb { display: inline-block; padding: var(--space-2, 8px) var(--space-3, 16px); background: var(--color-surface-2, #1f1331); border: var(--border-width, 1px) solid var(--color-border, #3d2b57); border-radius: var(--radius-pill, 999px); box-shadow: var(--shadow-low, 0 2px 6px rgba(0, 0, 0, 0.5)); }
.kit-breadcrumb ol { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2, 8px); margin: 0; padding: 0; list-style: none; font-family: var(--font-family, system-ui, sans-serif); font-size: var(--font-size-small, 0.875rem); }
.kit-breadcrumb li { display: inline-flex; align-items: center; }
.kit-breadcrumb a { color: var(--color-text-muted, #b9a6c9); text-decoration: none; padding: var(--space-1, 4px) var(--space-2, 8px); border-radius: var(--radius-pill, 999px); transition: color 0.15s, background 0.15s; }
.kit-breadcrumb a:hover { color: var(--color-primary-contrast, #14081f); background: var(--color-primary, #e8702a); text-decoration: none; }
.kit-breadcrumb a:focus-visible { outline: 2px solid var(--color-accent, #f5b83d); outline-offset: 2px; }
.kit-breadcrumb li + li::before { content: '›'; color: var(--color-secondary, #8b3fd9); font-weight: var(--font-weight-heading, 700); margin-right: var(--space-2, 8px); }
.kit-breadcrumb [aria-current="page"] { display: inline-block; padding: var(--space-1, 4px) var(--space-3, 16px); color: var(--color-primary-contrast, #14081f); background: var(--color-accent, #f5b83d); border-radius: var(--radius-pill, 999px); font-family: var(--font-family-heading, Impact, Arial, sans-serif); font-weight: var(--font-weight-heading, 700); letter-spacing: 0.04em; text-transform: uppercase; }
</style>
<nav class="kit-breadcrumb" aria-label="where you are">
  <ol><li><a href="#">Home</a></li><li><a href="#">Orders</a></li><li><a href="#">2024</a></li><li><span aria-current="page">#2041</span></li></ol>
</nav>
