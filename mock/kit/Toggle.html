<!-- Toggle: an on/off switch with its label. -->
<style>
.kit-toggle { display: grid; gap: var(--space-3, 1rem); padding: var(--space-4, 1.5rem); background: var(--color-surface-2, #171025); border: var(--border-width, 1px) solid var(--color-border, #33274f); border-radius: var(--radius-large, 16px); box-shadow: var(--shadow-low, 0 2px 8px rgba(0, 0, 0, 0.6)); font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #f4eeff); font-size: var(--font-size-base, 1rem); }
.kit-toggle label { display: flex; align-items: center; gap: var(--space-3, 1rem); cursor: pointer; }
.kit-toggle button { flex: none; width: 44px; height: 24px; border-radius: var(--radius-pill, 999px); border: var(--border-width, 1px) solid var(--color-border, #33274f); padding: 2px; background: var(--color-surface, #0b0713); cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s; }
.kit-toggle button i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--color-text-muted, #b5a8cf); transition: transform .15s, background .15s; }
.kit-toggle button:focus-visible { outline: 2px solid var(--color-accent-cyan, #27d7f0); outline-offset: 2px; }
.kit-toggle button[aria-checked="true"] { background: var(--color-primary, #a855f7); border-color: var(--color-primary, #a855f7); box-shadow: var(--shadow-low, 0 2px 8px rgba(0, 0, 0, 0.6)); }
.kit-toggle button[aria-checked="true"] i { transform: translateX(20px); background: var(--color-primary-contrast, #0b0713); }
.kit-toggle button:disabled { opacity: .5; cursor: default; }
.kit-toggle label:has(button:disabled) { cursor: default; color: var(--color-text-muted, #b5a8cf); }
.kit-toggle span { font-size: var(--font-size-base, 1rem); }
</style>
<div class="kit-toggle">
  <label><button type="button" role="switch" aria-checked="true"><i></i></button><span>Email me a weekly digest</span></label>
  <label><button type="button" role="switch" aria-checked="false"><i></i></button><span>Show prices with tax</span></label>
  <label><button type="button" role="switch" aria-checked="false" disabled><i></i></button><span>Beta features</span></label>
</div>
<script>
(() => {
  const root = document.currentScript.closest('[data-kit]') || document.currentScript.parentElement;
  root.querySelectorAll('[role="switch"]').forEach((b) => b.addEventListener('click', () => b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true'))));
})();
</script>
