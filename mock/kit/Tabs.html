<!-- Tabs: a row of tabs switching the panel below. -->
<style>
.kit-tabs { font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #f5ecf7); background: var(--color-surface, #120a1c); border: var(--border-width, 1px) solid var(--color-border, #3d2b57); border-radius: var(--radius-large, 20px); box-shadow: var(--shadow-low, 0 2px 6px rgba(0, 0, 0, 0.5)); padding: var(--space-3, 16px); }
.kit-tabs [role="tablist"] { display: flex; gap: var(--space-2, 8px); padding: var(--space-1, 4px); background: var(--color-surface-2, #1f1331); border: var(--border-width, 1px) solid var(--color-border, #3d2b57); border-radius: var(--radius-pill, 999px); }
.kit-tabs [role="tab"] { flex: 1; font: inherit; font-family: var(--font-family-heading, Impact, Arial, sans-serif); font-size: var(--font-size-small, 0.875rem); font-weight: var(--font-weight-heading, 700); text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted, #b9a6c9); background: transparent; border: 0; border-radius: var(--radius-pill, 999px); padding: var(--space-2, 8px) var(--space-3, 16px); cursor: pointer; transition: background 0.15s, color 0.15s; }
.kit-tabs [role="tab"]:hover { color: var(--color-text, #f5ecf7); }
.kit-tabs [role="tab"]:focus-visible { outline: 2px solid var(--color-accent, #f5b83d); outline-offset: 2px; }
.kit-tabs [role="tab"][aria-selected="true"] { color: var(--color-primary-contrast, #14081f); background: var(--color-primary, #e8702a); box-shadow: var(--shadow-low, 0 2px 6px rgba(0, 0, 0, 0.5)); }
.kit-tabs [role="tabpanel"] { margin-top: var(--space-3, 16px); padding: var(--space-3, 16px); background: var(--color-surface-2, #1f1331); border-left: 3px solid var(--color-secondary, #8b3fd9); border-radius: var(--radius-medium, 12px); font-size: var(--font-size-base, 1rem); line-height: 1.5; }
.kit-tabs [role="tabpanel"][hidden] { display: none; }
</style>
<div class="kit-tabs">
  <div role="tablist"><button type="button" role="tab" aria-selected="true">Overview</button><button type="button" role="tab" aria-selected="false">Details</button><button type="button" role="tab" aria-selected="false">History</button></div>
  <div role="tabpanel">Neon Night Pass: 3 shows, 2 guests, $89.00 total.</div>
  <div role="tabpanel" hidden>Seat B12 and B13, doors at 7:30 PM, Hall Marée.</div>
  <div role="tabpanel" hidden>Paid on Oct 2, confirmed on Oct 3, tickets sent.</div>
</div>
<script>
(() => {
  const root = document.currentScript.closest('[data-kit]') || document.currentScript.parentElement;
  const tabs = [...root.querySelectorAll('[role="tab"]')];
  const panels = [...root.querySelectorAll('[role="tabpanel"]')];
  tabs.forEach((tab, i) => tab.addEventListener('click', () => {
    tabs.forEach((t, j) => t.setAttribute('aria-selected', String(i === j)));
    panels.forEach((p, j) => { p.hidden = i !== j; });
  }));
})();
</script>
