[package]
name = "ports-llm-claude-code"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The adapter of the `llm` port that ports.json names: the DM's own `claude` program (Claude Code) run as `claude -p --model claude-haiku-5-5 --effort medium`, under the DM's subscription. It passes `ports_llm::contract`."
publish = false

[dependencies]
ports-llm = { path = ".." }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
serde_json = "1"
