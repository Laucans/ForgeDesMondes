[package]
name = "get-live-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Capability session.getLiveSession: the running session's header, its campaign, its present PCs and its microphone state, the status labelled per SessionLifecycle@1 — rows in, answer out."
publish = false

[dependencies]
serde_json = "1"

[dev-dependencies]
platform-conformance = { path = "../../../platform/conformance" }
# The harness's test kit: its Scratch runs the SQL on PostgreSQL, migrated as the server migrates it.
platform-test-kit = { path = "../../../platform/test-kit" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
