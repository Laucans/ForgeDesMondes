[package]
name = "reorder-scenes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability session.reorderScenes: a session's scenes in the order the DM gives, every rank rewritten at once, on the session's scene order — a Session partition of its own."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
# Its target aggregate: the order's field and row, and its ranks written when it is applied.
aggregate-session = { path = "../../aggregates/Session" }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the tables its tests write.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
