[package]
name = "add-present-character"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability session.addPresentCharacter: one more PC of the session's campaign ticked present, on a Session partition of its own; session_roster_view lists it « present »."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
# Its target aggregate: a presence's fields, and its table written when it is applied.
aggregate-session = { path = "../../aggregates/Session" }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the tables its tests write.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
