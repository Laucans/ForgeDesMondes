[package]
name = "add-journal-line"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability session.addJournalLine: a phrase the live session's microphone heard becomes a timestamped line of its journal, text only, kept on the machine; a closed session takes no more."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
# The engine's `Prepare` and the projection are async traits.
async-trait = "0.1"
serde_json = "1"
# The aggregate's field names and its uuid check, which src/ calls.
aggregate-session = { path = "../../aggregates/Session" }

[dev-dependencies]
# The harness's test kit: the engine planted, the scratch database, planters.
platform-test-kit = { path = "../../../platform/test-kit" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
