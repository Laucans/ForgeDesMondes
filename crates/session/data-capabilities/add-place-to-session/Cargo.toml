[package]
name = "add-place-to-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability session.addPlaceToSession: a place of the session's campaign linked to one of its scenes, after its last element, on the scene's Session partition; its media follow through session_media_view."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
# Its target aggregate: a scene's fields, and its tables written when it is applied.
aggregate-session = { path = "../../aggregates/Session" }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the tables its tests write.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
