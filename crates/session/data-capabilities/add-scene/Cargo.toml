[package]
name = "add-scene"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability session.addScene: a new scene of a session, ranked after its last, with its title, its notes and the places of the session's campaign it links, on a Session partition of its own."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
# Its target aggregate: a scene's fields, and its tables written when it is applied.
aggregate-session = { path = "../../aggregates/Session" }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the tables its tests write.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
