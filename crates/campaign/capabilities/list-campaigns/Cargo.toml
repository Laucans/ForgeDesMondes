[package]
name = "list-campaigns"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Capability campaign.listCampaigns: every campaign and oneshot of the home page — id, name, type, cover, glyph, pitch, sessions, dates — rows in, answer out."
publish = false

[dependencies]
serde_json = "1"

[dev-dependencies]
# The harness's test kit: the scratch database migrated as the server migrates it, the mock-up's fixture.
platform-test-kit = { path = "../../../platform/test-kit" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
