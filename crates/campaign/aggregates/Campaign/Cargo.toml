[package]
name = "aggregate-campaign"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Aggregate Campaign: a campaign's row — its invariants judged as code (oneshot-single-session, import-creates-copy, export-stamps-date, master-volume-range), and its projection into the campaign table: the exports' stamps, the fixtures' campaigns hydrated."
publish = false

# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
[dependencies]
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the projection's tests run on the
# tables as the product migrates them.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
# The tests' bench (rules 19, 21): the unit's engine over a scratch database
# migrated by the Data layer.
platform-test-kit = { path = "../../../platform/test-kit" }
