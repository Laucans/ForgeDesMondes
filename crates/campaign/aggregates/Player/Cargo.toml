[package]
name = "aggregate-player"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Aggregate Player: a real person at the DM's table, never a campaign element — its invariant judged as code (player-not-character)."
publish = false

# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
[dependencies]
harness-dataguard = { workspace = true }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
