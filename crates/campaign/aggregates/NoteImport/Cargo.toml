[package]
name = "aggregate-note-import"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Aggregate NoteImport: an imported note and the proposals its analysis made — its invariant judged as code (no-creation-before-validation); its writes projected into its tables in the apply transaction; each note's proposals kept for a validation to read; the follow-up commands its two DataCapabilities announce."
publish = false

# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
[dependencies]
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
# The migrations the projection's tables come from, applied to a scratch database.
data = { path = "../../../data" }
# The two DataCapabilities that write a note and its proposals, and the
# element a validation saves, as the server plants them.
extract-from-notes = { path = "../../../ai/data-capabilities/extract-from-notes" }
create-entities-from-note = { path = "../../data-capabilities/create-entities-from-note" }
aggregate-entity = { path = "../Entity" }
save-entity = { path = "../../data-capabilities/save-entity" }
ports-llm = { path = "../../../ports/llm" }
ports-speech-to-text = { path = "../../../ports/speech-to-text" }
