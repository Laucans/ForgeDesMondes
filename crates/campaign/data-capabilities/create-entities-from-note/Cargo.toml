[package]
name = "create-entities-from-note"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability campaign.createEntitiesFromNote: the DM's validated list of a note's proposals — each kept proposal checked and made an element of its type, name and excerpt with its first version (EntityVersion@1), a PC or an NPC with its sheet and token colour; one already created, or recognising an element the campaign holds, never made twice; the others unchecked."
publish = false

[dependencies]
serde_json = "1"
# The ids an element is given are derived from its proposal's, so a retried
# validation finds the element it made and does not make it twice.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
# The Concept's fixtures `version` is held to.
platform-conformance = { path = "../../../platform/conformance" }
