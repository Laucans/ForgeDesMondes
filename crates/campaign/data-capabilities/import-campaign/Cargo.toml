[package]
name = "import-campaign"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability campaign.importCampaign: the DM imports a campaign archive and always gets a new, separate campaign — its players, elements, media, sounds, sessions, scenes and journal under new ids, every reference pointing at the copy (import-creates-copy); the original is never touched."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
# Its target aggregate, which its tests plant beside it. A normal
# dependency instead when src/ calls one of its helpers.
aggregate-campaign = { path = "../../aggregates/Campaign" }
# The CampaignArchive@2 fixtures the copy is held to.
platform-conformance = { path = "../../../platform/conformance" }
# The harness's test kit: the engine planted, the scratch database, planters.
platform-test-kit = { path = "../../../platform/test-kit" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
