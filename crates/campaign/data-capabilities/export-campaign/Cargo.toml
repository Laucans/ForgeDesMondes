[package]
name = "export-campaign"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability campaign.exportCampaign: a campaign, its players, its elements with their sheets, aliases and versions, its media with their battlemap grids, its sounds, its sessions with their present characters, scenes and journal, as the tables hold them, made one self-contained JSON archive — and the stamp of its last export, the one field the command writes on its Campaign partition (export-stamps-date)."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The aggregate the export targets, its judge and its projection: what the
# engine plants beside the export (a dev-dependency, as isolation.sh allows).
aggregate-campaign = { path = "../../aggregates/Campaign" }
# The migrations' applier the server runs: the archive's tests read the
# tables as the product migrates them.
data = { path = "../../../data" }
# The CampaignArchive@1 fixtures the archive is held to.
platform-conformance = { path = "../../../platform/conformance" }
# Its tests' database and engine: a Scratch database, migrated by the Data layer.
platform-test-kit = { path = "../../../platform/test-kit" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
