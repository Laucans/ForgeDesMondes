# fields: campaign.id, campaign.name, campaign.kind, campaign.art, campaign.glyph, campaign.pitch, campaign.createdAt, session.campaignId, session.status, session.startedAt, session.plannedOn
# Every campaign and oneshot of the home page, newest first: no account, no
# owner. Each carries its session count and its last-played and next-session
# days, counted from its rows of the session table, never stored.
query ListCampaigns {
  campaigns {
    id
    name
    kind
    art
    glyph
    pitch
    createdAt
    sessionCount
    lastPlayed
    nextSession
  }
}
