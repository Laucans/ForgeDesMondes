[package]
name = "soundbox-read"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The soundbox system's read crate: the read-only connection its Capabilities read through (DATABASE_URL_READONLY), with no write API."
publish = false

[dependencies]
data = { path = "../../data" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
