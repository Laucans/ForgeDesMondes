[package]
name = "add-sound"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability soundbox.addSound: a sound added to a campaign's library on its own Sound partition — the wire payload mapped, its tags normalised (SoundTag@1), its volume given in percent and stored as a fraction of 1."
publish = false

[dependencies]
serde_json = "1"

[dev-dependencies]
# The Concept the tags are held to (SoundTag@1).
platform-conformance = { path = "../../../platform/conformance" }
