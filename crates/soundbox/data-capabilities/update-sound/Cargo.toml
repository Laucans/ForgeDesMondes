[package]
name = "update-sound"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability soundbox.updateSound: an existing sound of the library edited on its Sound partition — the wire payload mapped, the fields it names alone, its tags normalised (SoundTag@1), its volume given in percent and stored as a fraction of 1."
publish = false

[dependencies]
serde_json = "1"

[dev-dependencies]
# The Concept the tags are held to (SoundTag@1).
platform-conformance = { path = "../../../platform/conformance" }
