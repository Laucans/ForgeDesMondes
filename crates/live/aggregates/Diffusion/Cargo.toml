[package]
name = "aggregate-diffusion"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Aggregate Diffusion: what the players' screen shows of a session — its invariants judged as code (base-coherent, window-proportional, window-fields-together, single-diffusion-source)."
publish = false

# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
[dependencies]
harness-dataguard = { workspace = true }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
