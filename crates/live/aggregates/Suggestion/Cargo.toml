[package]
name = "aggregate-suggestion"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Aggregate Suggestion: what the live session suggests to the DM — its invariants judged as code (suggestion-target, pile-and-history-derived, live-only-local-audio)."
publish = false

# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
[dependencies]
harness-dataguard = { workspace = true }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
