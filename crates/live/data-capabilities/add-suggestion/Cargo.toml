[package]
name = "add-suggestion"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability live.addSuggestion: records an element or a sound the microphone recognised, for a live session with the microphone on, as a Suggestion."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
# Its target aggregate, which its tests plant beside it. A normal
# dependency instead when src/ calls one of its helpers.
aggregate-suggestion = { path = "../../aggregates/Suggestion" }
# The harness's test kit: the engine planted, the scratch database, planters.
platform-test-kit = { path = "../../../platform/test-kit" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
