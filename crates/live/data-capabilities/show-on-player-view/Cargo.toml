[package]
name = "show-on-player-view"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability live.showOnPlayerView: the DM sends a battlemap instance of the session, or an illustration, as the player view's base, with its zoom and pan, on the session's Diffusion partition — the wire payload mapped against what the tables hold, an instance not of the session or a media that is no illustration of its campaign left out, which base-coherent refuses."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
# Its target aggregate: how a diffusion is stamped.
aggregate-diffusion = { path = "../../aggregates/Diffusion" }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the tables its tests write.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
