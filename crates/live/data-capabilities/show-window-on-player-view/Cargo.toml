[package]
name = "show-window-on-player-view"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability live.showWindowOnPlayerView: the DM opens an illustration of the campaign in the floating window of its live session's player view, on the session's Diffusion partition — x, y and width set together at their defaults, the height left to the media's proportions, the base left as the row holds it."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
# Its target aggregate: how a diffusion is stamped.
aggregate-diffusion = { path = "../../aggregates/Diffusion" }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the tables its tests write.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
