# Written by scripts/register.sh: never edited by hand. A unit folder
# added under crates/<system>/{aggregates,data-capabilities,capabilities}/
# is registered by running the script again; the build fails until it is.
[package]
name = "dataguard-registry"
version = "0.1.0"
edition = "2024"
description = "Every unit of the product, gathered: what the server plants."
publish = false
build = "build.rs"

# Every unit is used by the glue build.rs writes into OUT_DIR, which cargo
# machete does not read.
[package.metadata.cargo-machete]
ignored = [
    "aggregate-ai-settings",
    "aggregate-battlemap-instance",
    "aggregate-campaign",
    "aggregate-diffusion",
    "aggregate-entity",
    "aggregate-media",
    "aggregate-note-import",
    "aggregate-player",
    "aggregate-session",
    "aggregate-sound",
    "aggregate-sound-playback",
    "aggregate-suggestion",
    "change-hit-points",
    "create-battlemap-instance",
    "create-entities-from-note",
    "export-campaign",
    "extract-from-notes",
    "get-battlemap",
    "get-campaign",
    "get-entity",
    "get-settings",
    "list-campaigns",
    "list-characters",
    "list-entity-versions",
    "list-events",
    "list-imported-notes",
    "list-media",
    "list-places",
    "list-players",
    "move-token",
    "next-turn",
    "place-tokens",
    "remove-token",
    "rename-token",
    "restore-entity-version",
    "save-entity",
    "save-grid-settings",
    "save-settings",
    "set-media-place",
    "set-token-condition",
    "set-token-visibility",
    "test-connection",
    "upload-media",
]

[dependencies]
harness-dataguard = { git = "https://github.com/laucans/custom-harness", tag = "dataguard-v5", features = ["postgres", "uuid"] }
aggregate-ai-settings = { path = "../../ai/aggregates/AiSettings" }
aggregate-battlemap-instance = { path = "../../table/aggregates/BattlemapInstance" }
aggregate-campaign = { path = "../../campaign/aggregates/Campaign" }
aggregate-diffusion = { path = "../../live/aggregates/Diffusion" }
aggregate-entity = { path = "../../campaign/aggregates/Entity" }
aggregate-media = { path = "../../media/aggregates/Media" }
aggregate-note-import = { path = "../../campaign/aggregates/NoteImport" }
aggregate-player = { path = "../../campaign/aggregates/Player" }
aggregate-session = { path = "../../session/aggregates/Session" }
aggregate-sound = { path = "../../soundbox/aggregates/Sound" }
aggregate-sound-playback = { path = "../../soundbox/aggregates/SoundPlayback" }
aggregate-suggestion = { path = "../../live/aggregates/Suggestion" }
change-hit-points = { path = "../../table/data-capabilities/change-hit-points" }
create-battlemap-instance = { path = "../../table/data-capabilities/create-battlemap-instance" }
create-entities-from-note = { path = "../../campaign/data-capabilities/create-entities-from-note" }
export-campaign = { path = "../../campaign/data-capabilities/export-campaign" }
extract-from-notes = { path = "../../ai/data-capabilities/extract-from-notes" }
get-battlemap = { path = "../../media/capabilities/get-battlemap" }
get-campaign = { path = "../../campaign/capabilities/get-campaign" }
get-entity = { path = "../../campaign/capabilities/get-entity" }
get-settings = { path = "../../ai/capabilities/get-settings" }
list-campaigns = { path = "../../campaign/capabilities/list-campaigns" }
list-characters = { path = "../../campaign/capabilities/list-characters" }
list-entity-versions = { path = "../../campaign/capabilities/list-entity-versions" }
list-events = { path = "../../campaign/capabilities/list-events" }
list-imported-notes = { path = "../../campaign/capabilities/list-imported-notes" }
list-media = { path = "../../media/capabilities/list-media" }
list-places = { path = "../../campaign/capabilities/list-places" }
list-players = { path = "../../campaign/capabilities/list-players" }
move-token = { path = "../../table/data-capabilities/move-token" }
next-turn = { path = "../../table/data-capabilities/next-turn" }
place-tokens = { path = "../../table/data-capabilities/place-tokens" }
remove-token = { path = "../../table/data-capabilities/remove-token" }
rename-token = { path = "../../table/data-capabilities/rename-token" }
restore-entity-version = { path = "../../campaign/data-capabilities/restore-entity-version" }
save-entity = { path = "../../campaign/data-capabilities/save-entity" }
save-grid-settings = { path = "../../media/data-capabilities/save-grid-settings" }
save-settings = { path = "../../ai/data-capabilities/save-settings" }
set-media-place = { path = "../../media/data-capabilities/set-media-place" }
set-token-condition = { path = "../../table/data-capabilities/set-token-condition" }
set-token-visibility = { path = "../../table/data-capabilities/set-token-visibility" }
test-connection = { path = "../../ai/data-capabilities/test-connection" }
upload-media = { path = "../../media/data-capabilities/upload-media" }
