# Written by scripts/register.sh: never edited by hand. A unit folder
# added under crates/<system>/{aggregates,data-capabilities,capabilities}/
# is registered by running the script again; the build fails until it is.
[package]
name = "dataguard-registry"
version = "0.1.0"
edition = "2024"
description = "Every unit of the product, gathered: what the server plants."
publish = false
build = "build.rs"

# Every unit is used by the glue build.rs writes into OUT_DIR, which cargo
# machete does not read.
[package.metadata.cargo-machete]
ignored = [
    "add-participant",
    "add-place-to-session",
    "add-present-character",
    "add-scene",
    "add-sound",
    "aggregate-ai-settings",
    "aggregate-battlemap-instance",
    "aggregate-campaign",
    "aggregate-diffusion",
    "aggregate-entity",
    "aggregate-media",
    "aggregate-note-import",
    "aggregate-player",
    "aggregate-session",
    "aggregate-sound",
    "aggregate-sound-playback",
    "aggregate-suggestion",
    "change-hit-points",
    "close-window",
    "create-battlemap-instance",
    "create-campaign",
    "create-entities-from-note",
    "create-session",
    "end-combat",
    "export-campaign",
    "extract-from-notes",
    "get-battlemap",
    "get-battlemap-instance",
    "get-campaign",
    "get-diffusion",
    "get-entity",
    "get-session",
    "get-settings",
    "list-campaigns",
    "list-characters",
    "list-entity-versions",
    "list-events",
    "list-imported-notes",
    "list-media",
    "list-places",
    "list-players",
    "list-scenes",
    "list-sessions",
    "list-sounds",
    "move-token",
    "move-window",
    "next-turn",
    "place-tokens",
    "play-sound",
    "propose-character",
    "remove-participant",
    "remove-present-character",
    "remove-sound",
    "remove-token",
    "rename-token",
    "reorder-initiative",
    "reorder-scenes",
    "reset-battlemap",
    "resize-window",
    "restore-entity-version",
    "resync-character",
    "save-entity",
    "save-grid-settings",
    "save-settings",
    "set-master-volume",
    "set-media-place",
    "set-sound-volume",
    "set-token-condition",
    "set-token-visibility",
    "show-cover",
    "show-on-player-view",
    "show-window-on-player-view",
    "start-combat",
    "stop-all",
    "test-connection",
    "update-sound",
    "upload-media",
]

[dependencies]
harness-dataguard = { git = "https://github.com/laucans/custom-harness", tag = "dataguard-v5", features = ["postgres", "uuid"] }
add-participant = { path = "../../table/data-capabilities/add-participant" }
add-place-to-session = { path = "../../session/data-capabilities/add-place-to-session" }
add-present-character = { path = "../../session/data-capabilities/add-present-character" }
add-scene = { path = "../../session/data-capabilities/add-scene" }
