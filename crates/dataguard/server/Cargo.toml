[package]
name = "dataguard-server"
version = "0.1.0"
edition = "2024"
description = "The product's write side: the DataGuard engine bound to this product's aggregates and DataCapabilities, over its PostgreSQL. Installed by `harness init-repo`; the product owns it from here."
build = "build.rs"

# Above [dependencies], which the DataCapabilities' lines close.
[dev-dependencies]
# A dictation's audio, as the wire carries it.
base64 = "0.22"
# The migrations' applier the server runs, for the AiSettings migration's tests.
data = { path = "../../data" }
# The Concepts' fixtures the Entity migration's SQL is held to (AliasMatch@1,
# AbilityModifier@1).
platform-conformance = { path = "../../platform/conformance" }
tower = { version = "0.5", default-features = false, features = ["util"] }

# The engine is the harness's, taken by git at a release tag (`dataguard-vN`,
# never moved). This line is the one place the tag is written:
# `scripts/register.sh` copies it into the registry's Cargo.toml and into the
# root Cargo.toml's [workspace.dependencies], whence every unit takes it — one
# engine, one `Plugin` type. Every unit's plugin reaches this server through
# the registry (`dataguard-registry`, the script's); the lines below it are
# what the legacy submit chain, projection and reads still call, each deleted
# with the branch that calls it, unit by unit.
[dependencies]
harness-dataguard = { git = "https://github.com/laucans/custom-harness", tag = "dataguard-v4", features = ["postgres", "uuid"] }
dataguard-registry = { path = "../registry" }
# The Entity aggregate's index of names and aliases, which an analysis of
# notes recognises the campaign's elements by (`Rows::known`).
aggregate-entity = { path = "../../campaign/aggregates/Entity" }
# The AiSettings aggregate's stamp, to the millisecond, which the legacy
# submit chain stamps every command with.
aggregate-ai-settings = { path = "../../ai/aggregates/AiSettings" }
# The provider the AI settings make active, which an analysis of notes is
# generated by.
ai-provider = { path = "../../ai/provider" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
# The ids a new element and each version it takes are given.
getrandom = "0.4"
# The port a save of the AI settings detects its API type through, and a
# connection test reaches the provider by.
ports-llm = { path = "../../ports/llm" }
# The port a dictation of notes is transcribed by, locally.
ports-speech-to-text = { path = "../../ports/speech-to-text" }
# --- Capabilities (the reads `reads.rs` still serves) ---
get-settings = { path = "../../ai/capabilities/get-settings" }
get-campaign = { path = "../../campaign/capabilities/get-campaign" }
get-entity = { path = "../../campaign/capabilities/get-entity" }
list-campaigns = { path = "../../campaign/capabilities/list-campaigns" }
list-characters = { path = "../../campaign/capabilities/list-characters" }
list-entity-versions = { path = "../../campaign/capabilities/list-entity-versions" }
list-events = { path = "../../campaign/capabilities/list-events" }
list-imported-notes = { path = "../../campaign/capabilities/list-imported-notes" }
list-places = { path = "../../campaign/capabilities/list-places" }
list-players = { path = "../../campaign/capabilities/list-players" }

# --- DataCapabilities (the branches of the legacy submit chain) ---
save-entity = { path = "../../campaign/data-capabilities/save-entity" }
extract-from-notes = { path = "../../ai/data-capabilities/extract-from-notes" }
create-entities-from-note = { path = "../../campaign/data-capabilities/create-entities-from-note" }
