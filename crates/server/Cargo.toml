[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The product's one server binary: the shell's wire protocol through the DataGuard engine (crates/dataguard/server), GET /health, the migrations through the Data layer, the mock-up's fixtures, PORTS=fake."
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# The unit that adds a sound: its tag normalisation, which the fixtures reuse.
add-sound = { path = "../soundbox/data-capabilities/add-sound" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
data = { path = "../data" }
dataguard-server = { path = "../dataguard/server" }
# Every unit of the product, gathered: what `server inventory` lists.
dataguard-registry = { path = "../dataguard/registry" }
# The one Capability the registry cannot answer (hostless: it reads the llm
# port's journal, not rows), served by this server's own route.
list-provider-requests = { path = "../ai/capabilities/list-provider-requests" }
ports-character-sheets = { path = "../ports/character-sheets" }
ports-llm = { path = "../ports/llm" }
ports-speech-to-text = { path = "../ports/speech-to-text" }
# The speech-to-text port's real adapter, for `PORTS=local`: the Phonon sidecar.
ports-speech-to-text-phonon = { path = "../ports/speech-to-text/phonon-local-to-be-evaluated-as-the-decision-requests" }
serde_json = "1"
# The microphone's streams, which the server binds to the engine it plants.
set-microphone = { path = "../live/data-capabilities/set-microphone" }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
uuid = { version = "1", default-features = false, features = ["v5"] }

[dev-dependencies]
platform-scratch-db = { path = "../platform/scratch-db" }
tower = { version = "0.5", default-features = false, features = ["util"] }
