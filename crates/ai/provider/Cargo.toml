[package]
name = "ai-provider"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The ai system's plumbing: the provider the AI settings make active (AiSettings/1), as the llm port is handed it — what an analysis of notes is generated by."
publish = false

# Plumbing shared inside the ai system: a port, and no unit (scripts/isolation.sh, rule 3).
[dependencies]
ports-llm = { path = "../../ports/llm" }
serde_json = "1"
