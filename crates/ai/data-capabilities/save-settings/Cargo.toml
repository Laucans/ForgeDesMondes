[package]
name = "save-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability ai.saveSettings: the DM's provider, API or binary, saved whole on the AiSettings/1 partition and made active — the wire payload mapped, the API type derived from the URL through the llm port, never given."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
ports-llm = { path = "../../../ports/llm" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
