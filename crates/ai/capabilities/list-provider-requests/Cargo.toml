[package]
name = "list-provider-requests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Capability ai.listProviderRequests: the requests the llm port received, in order — kind, provider, text — read from the port's journal."
publish = false

[dependencies]
ports-llm = { path = "../../../ports/llm" }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
