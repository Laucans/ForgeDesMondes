[package]
name = "aggregate-media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Aggregate Media: a campaign's battlemap or illustration and a battlemap's hex grid — its invariants judged as code (grid-only-for-battlemap, hex-is-five-feet, grid-values-range)."
publish = false

# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
[dependencies]
harness-dataguard = { workspace = true }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
