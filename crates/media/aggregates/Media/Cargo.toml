[package]
name = "aggregate-media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Aggregate Media: a campaign's battlemap or illustration and a battlemap's hex grid — its invariants judged as code (grid-only-for-battlemap, hex-is-five-feet, grid-values-range), its tables (media, battlemap_grid) written in the transaction that applies it."
publish = false

# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
# Its PostgreSQL client is the engine's re-export, never a driver of this crate.
[dependencies]
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the tables the projection writes.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
