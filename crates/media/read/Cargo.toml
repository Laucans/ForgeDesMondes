[package]
name = "media-read"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The media system's read crate: one read-only connection on DATABASE_URL_READONLY, opened through the Data layer, the rows of a persisted query as JSON, no write API."
publish = false

[dependencies]
data = { path = "../../data" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
