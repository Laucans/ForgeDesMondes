[package]
name = "save-grid-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability media.saveGridSettings: a battlemap's hex grid — size, offsets, orientation, colour, opacity — saved on its Media partition, the wire's HexGrid@1 words mapped to the aggregate's fields; never its 5 feet per hex."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# Its target aggregate, which its tests plant beside it.
aggregate-media = { path = "../../aggregates/Media" }
# The migrations' applier the server runs: the tables its tests write.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
