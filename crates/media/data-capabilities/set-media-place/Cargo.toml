[package]
name = "set-media-place"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability media.setMediaPlace: a media of a campaign, battlemap or illustration, attached to one of its campaign's places — an element of type « lieu » — or detached, on its Media partition; its place_id and nothing else."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
# Its target aggregate: the place of a media, as the tables hold it.
aggregate-media = { path = "../../aggregates/Media" }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the tables its tests write.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
