[package]
name = "import-character"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability dndbeyond.importCharacter: a PC imported by its D&D Beyond URL through the character-sheets port — created in its campaign, or the PC already linked to that character updated — with its name, its StatBlock@1 statblock, its link and sync date and a default token colour (TokenAppearance@1), on its Entity partition and versioned with source `dndbeyond` (EntityVersion@1)."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
# Its target aggregate: how an element's dates are written, and its versions settled.
aggregate-entity = { path = "../../../campaign/aggregates/Entity" }
# The engine's `Prepare` is an async trait.
async-trait = "0.1"
ports-character-sheets = { path = "../../../ports/character-sheets" }
serde_json = "1"
# A new PC's id, derived from its campaign and its character (v5).
uuid = { version = "1", default-features = false, features = ["v5"] }

[dev-dependencies]
# The migrations' applier the server runs: the tables its PostgreSQL tests write.
data = { path = "../../../data" }
# The Concept `statblock` is held to (StatBlock@1).
platform-conformance = { path = "../../../platform/conformance" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
