# fields: battlemapInstance.id, battlemapInstance.battlemapMediaId, battlemapInstance.sessionId, battlemapInstance.sceneId, token.id, token.characterId, token.number, token.name, token.q, token.r, token.visible, token.hpCurrent, token.hpMax, token.conditions, entity.type, character.tokenColor, character.portraitMediaId, character.tokenCrop, combat.id, combat.round, combat.currentEntryId, combat.endedAt, combat.startedAt, initiativeEntry.id, initiativeEntry.tokenId, initiativeEntry.initiative, initiativeEntry.rank, initiativeOrderView.entryId, initiativeOrderView.orderIndex, initiativeOrderView.shownToPlayers, initiativeOrderView.skipped, sessionPresentCharacter.sessionId, sessionPresentCharacter.characterId, sessionPresentCharacter.addedAt
# The battlemap screens' read: one instance of a battlemap, its tokens with the
# sheet each stands for (kind, token colour, portrait and crop), its open
# combat with the carousel's order, and the PCs ticked present at its session,
# in the order they were ticked — the characters it proposes (present-only-pj) —,
# and the initiative last entered for each PC with a token on it: its entry in
# the instance's latest combat by start, open or ended (the carousel's own
# combat stays the open one).
# The band, the death and the initial are not read: they are derived from the
# hit points and the name (HealthBand@1, dead-derived). The Capability keeps what the view it is asked for may show
# (crates/table/capabilities/get-battlemap-instance).
query GetBattlemapInstance($instance: ID!) {
  battlemapInstance(id: $instance) {
    id
    battlemapMediaId
    sessionId
    sceneId
    session {
      presentCharacters {
        characterId
        addedAt
      }
    }
    tokens {
      id
      characterId
      number
      name
      q
      r
      visible
      hpCurrent
      hpMax
      conditions
      character {
        tokenColor
        portraitMediaId
        tokenCrop
        entity {
          type
        }
      }
    }
    combats {
      startedAt
      entries {
        initiative
        token {
          characterId
          character {
            entity {
              type
            }
          }
        }
      }
    }
    combat(open: true) {
      id
      round
      currentEntryId
      entries {
        id
        tokenId
        initiative
        order {
          orderIndex
          shownToPlayers
          skipped
        }
      }
    }
  }
}
