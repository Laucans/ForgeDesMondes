[package]
name = "change-hit-points"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability table.changeHitPoints: one NPC token's current HP changed by a delta, clamped to 0..hp_max, on its own BattlemapInstance partition — never another token of the same character (hp-change-one-token); dead at 0, which the table derives (dead-derived); a PC's token tracks no HP (pj-hp-not-tracked)."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
# Its target aggregate, which its tests plant beside it.
aggregate-battlemap-instance = { path = "../../aggregates/BattlemapInstance" }
# The migrations' applier the server runs: the tables its tests read.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
