[package]
name = "remove-token"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability table.removeToken: one token of a battlemap instance taken off the map, its own BattlemapInstance partition tombstoned (a soft delete) and nothing else written — the order closes up by itself, and a turn held by the token is moved first by table.nextTurn, sent before it."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
# Its target aggregate, which its tests plant beside it.
aggregate-battlemap-instance = { path = "../../aggregates/BattlemapInstance" }
# The migrations' applier the server runs: the tables its tests read.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
