[package]
name = "rename-token"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability table.renameToken: one token of a battlemap instance renamed — « Bandit 2 » becomes « Bandit blessé » — its number and the other tokens of its character untouched."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
# Its target aggregate, which its tests plant beside it.
aggregate-battlemap-instance = { path = "../../aggregates/BattlemapInstance" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
