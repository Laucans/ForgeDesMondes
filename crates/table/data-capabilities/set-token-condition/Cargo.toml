[package]
name = "set-token-condition"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability table.setTokenCondition: a condition badge put on one token of a battlemap instance or taken off, on its own BattlemapInstance partition — its conditions alone, never its hit points nor its death, never another token of the same character nor another instance's (instance-isolated), persisted at every action (state-persisted-reset)."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
# Its target aggregate, which its tests plant beside it.
aggregate-battlemap-instance = { path = "../../aggregates/BattlemapInstance" }
# The migrations' applier the server runs: the tables its tests read.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
