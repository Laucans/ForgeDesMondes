[package]
name = "start-combat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability table.startCombat: a battlemap instance's combat, every token in it (Initiative@1) — an NPC's d20 + DEX modifier, a PC's initiative the DM's (npc-initiative-bounds), ranked by initiative, then DEX, then a draw (initiative-tiebreak), a hidden token like any other (hidden-keeps-rank); round 1 on rank 1, and never a second open combat (one-active-combat)."
publish = false

[dependencies]
serde_json = "1"

[dev-dependencies]
# The Concept's fixtures `initiative` and `ranked` are held to.
platform-conformance = { path = "../../../platform/conformance" }
