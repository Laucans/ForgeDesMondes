[package]
name = "reorder-initiative"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability table.reorderInitiative: the DM's new order of a battlemap instance's open combat — every participant once, named by its token or its entry — written as each initiative entry's rank, 1 to n without gap or duplicate, a hidden participant like any other (hidden-keeps-rank); no participant added or removed, the turn and the round left as they are."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
# Its target aggregate, which its tests plant beside it.
aggregate-battlemap-instance = { path = "../../aggregates/BattlemapInstance" }
# The migrations' applier the server runs: the tables its tests read.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
