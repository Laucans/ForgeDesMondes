[package]
name = "remove-participant"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DataCapability table.removeParticipant: one participant of a battlemap instance's open combat taken out of the turn order, its initiative entry's BattlemapInstance partition tombstoned (a soft delete) and nothing else written — its token stays on the map, the order closes up by itself, and a turn held by the participant is moved first by table.nextTurn, sent before it."
publish = false

[dependencies]
# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
# Its target aggregate, which its tests plant beside it.
aggregate-battlemap-instance = { path = "../../aggregates/BattlemapInstance" }
# The migrations' applier the server runs: the tables its tests read.
data = { path = "../../../data" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
