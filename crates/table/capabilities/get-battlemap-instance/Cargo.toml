[package]
name = "get-battlemap-instance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Capability table.getBattlemapInstance: the DM view and the player view of a battlemap instance — its tokens, its combat and its carousel; rows in, answer out."
publish = false

[dependencies]
serde_json = "1"

[dev-dependencies]
platform-conformance = { path = "../../../platform/conformance" }
# The harness's test kit: its Bench plants the engine over a scratch database
# migrated as the server migrates it, its `read` checks the SQL's guards.
platform-test-kit = { path = "../../../platform/test-kit" }
# What writes the initiatives the tests read back: the engine, its aggregate and
# the DataCapabilities that seat, end, tombstone, remove and add to a combat.
harness-dataguard = { workspace = true }
aggregate-battlemap-instance = { path = "../../aggregates/BattlemapInstance" }
start-combat = { path = "../../data-capabilities/start-combat" }
end-combat = { path = "../../data-capabilities/end-combat" }
reset-battlemap = { path = "../../data-capabilities/reset-battlemap" }
remove-participant = { path = "../../data-capabilities/remove-participant" }
add-participant = { path = "../../data-capabilities/add-participant" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
