[package]
name = "aggregate-battlemap-instance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Aggregate BattlemapInstance: a battlemap laid on the table for a scene, its tokens, hit points and combat — its invariants judged as code, its tables (battlemap_instance, token, combat, initiative_entry) written in the transaction that applies it."
publish = false

# The engine is the workspace's: one engine, one `Plugin` type (scripts/register.sh).
# Its PostgreSQL client is the engine's re-export, never a driver of this crate.
[dependencies]
harness-dataguard = { workspace = true }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
# The migrations' applier the server runs: the tables the projection writes.
data = { path = "../../../data" }
# A Concept's fixtures, read from the repository.
platform-conformance = { path = "../../../platform/conformance" }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
